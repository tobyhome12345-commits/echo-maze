# The standard checks (tools/check.js) on every pull request, in a fresh Linux machine with Chrome - the same
# thing a cloud session runs. It only reads the repo: it deploys nothing (the site is published from main by
# GitHub Pages, never from here) and it needs no secrets.
name: checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: tools/check.js (the quick set)
        run: node tools/check.js
