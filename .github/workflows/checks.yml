# The standard checks (tools/check.js) on every pull request and every push to main, in a fresh Linux machine with
# Chrome - the same thing a cloud session runs (a release runs the full gate, `check.js --release`, before it pushes;
# this is the second look that makes a bad main show as a red cross on GitHub). It only reads the repo: it deploys
# nothing (the site is published from main by GitHub Pages, never from here) and it needs no secrets.
name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: tools/check.js (the quick set)
        run: node tools/check.js
